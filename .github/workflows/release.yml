name: Release
run-name: Release ${{ inputs.prerelease }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      prerelease:
        type: choice
        options:
          - 'alpha'
          - 'beta'
          - 'rc'
          - 'none'
        description: Prerelease type
        default: 'none'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      npm_tag: ${{ steps.release_metadata.outputs.npm_tag }}
      tag: ${{ steps.release_metadata.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release ref
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "Release must run from a branch. Current ref type: $GITHUB_REF_TYPE"
            exit 1
          fi

          if [ "$PRERELEASE" = "none" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Stable releases are allowed only from main. Current branch: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-env
        with:
          node-version: '24.x'

      - name: Run package type checks
        run: yarn tsc

      - name: Run test type checks
        run: yarn tsc:tests

      - name: Run Storybook type checks
        run: yarn tsc:storybook

      - name: Run e2e config type checks
        run: yarn tsc:e2e

      - name: Run eslint
        run: yarn eslint

      - name: Run tests
        run: yarn test

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run e2e tests
        run: yarn test:e2e

      - name: Build packages
        run: yarn build

      - name: Validate packed packages
        run: yarn test:packages

      - name: Build React Storybook
        run: yarn workspace @modulify/m3-react storybook:build --test --quiet

      - name: Build Vue Storybook
        run: yarn workspace @modulify/m3-vue storybook:build --test --quiet

      - name: Configure Git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Create prerelease commit and tag
        if: ${{ inputs.prerelease != 'none' }}
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn release:${{ inputs.prerelease }}

      - name: Create stable release commit and tag
        if: ${{ inputs.prerelease == 'none' }}
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
        run: yarn release

      - name: Resolve release metadata
        id: release_metadata
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          RELEASE_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          RELEASE_TAG="v${RELEASE_VERSION}"

          git rev-parse --verify "refs/tags/${RELEASE_TAG}"

          if [ "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" != "$(git rev-parse HEAD)" ]; then
            echo "Release tag ${RELEASE_TAG} does not point to the release commit."
            exit 1
          fi

          if [ "$PRERELEASE" = "none" ]; then
            NPM_TAG="latest"
          else
            NPM_TAG="$PRERELEASE"
          fi

          echo "npm_tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Push release commit and tag
        env:
          RELEASE_TAG: ${{ steps.release_metadata.outputs.tag }}
        run: git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" "refs/tags/${RELEASE_TAG}"

  publish:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-env
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org

      - name: Build packages
        run: yarn build

      - name: Validate packed packages
        run: yarn test:packages

      - name: Publish packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_PUBLISH_TOKEN }}
          NPM_TAG: ${{ needs.release.outputs.npm_tag }}
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Publishing with an npm token."
            # npm prefers OIDC when both authentication methods are available.
            unset NPM_ID_TOKEN
            unset ACTIONS_ID_TOKEN_REQUEST_URL
            unset ACTIONS_ID_TOKEN_REQUEST_TOKEN
          else
            echo "Publishing with npm trusted publishing."
            unset NODE_AUTH_TOKEN
          fi

          yarn publish:packages

  storybook-pages:
    needs:
      - release
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node and dependencies
        uses: ./.github/actions/setup-env
        with:
          node-version: '24.x'

      - name: Build React Storybook
        env:
          STORYBOOK_VERSION: ${{ needs.release.outputs.tag }}
        run: yarn workspace @modulify/m3-react storybook:build --quiet

      - name: Build Vue Storybook
        env:
          STORYBOOK_VERSION: ${{ needs.release.outputs.tag }}
        run: yarn workspace @modulify/m3-vue storybook:build --quiet

      - name: Detect Storybook Pages history
        id: pages_history
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Storybook Pages history
        if: steps.pages_history.outputs.exists == 'true'
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: storybook-pages
          fetch-depth: 1

      - name: Initialize Storybook Pages history
        if: steps.pages_history.outputs.exists != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}
          path: storybook-pages
          fetch-depth: 1

      - name: Create Storybook Pages branch
        if: steps.pages_history.outputs.exists != 'true'
        run: |
          git -C storybook-pages switch --orphan gh-pages
          git -C storybook-pages rm -rf --ignore-unmatch .

      - name: Prepare versioned Storybooks
        env:
          NPM_TAG: ${{ needs.release.outputs.npm_tag }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: node scripts/prepare-storybook-pages.mjs storybook-pages "$RELEASE_TAG" "$NPM_TAG"

      - name: Save Storybook Pages history
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          git -C storybook-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C storybook-pages config user.name "github-actions[bot]"
          git -C storybook-pages add --all

          if git -C storybook-pages diff --cached --quiet; then
            echo "Storybook Pages already contains ${RELEASE_TAG}."
          else
            git -C storybook-pages commit -m "docs: Storybooks for ${RELEASE_TAG} were published"
            git -C storybook-pages push origin gh-pages
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Storybook Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-pages
          include-hidden-files: true

  deploy-storybook-pages:
    needs: storybook-pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Storybooks to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
