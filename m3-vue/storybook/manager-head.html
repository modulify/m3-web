<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" />

<style>
    :root {
        --m3-storybook-font-family: 'Roboto', 'Noto Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    html,
    body,
    #root,
    button,
    input,
    select,
    textarea {
        font-family: var(--m3-storybook-font-family);
    }

    .s-m3-logo {
        display: inline-flex;
        align-items: center;
        font-size: 24px;
        font-family: var(--m3-storybook-font-family);
        font-weight: 500;
        margin-left: -8px;
    }

    .s-m3-logo img {
        margin-right: 12px;
    }

    .s-m3-logo__version {
        align-self: flex-start;
        font-size: 11px;
        font-weight: 400;
        line-height: 1;
        margin-left: 6px;
        margin-top: 5px;
    }

    button[aria-label^="Storybook content language"] > svg {
        display: none;
    }

    button[aria-label^="Storybook content language"]::before,
    li[id$="-opt-en-US"] > div::before,
    li[id$="-opt-ru-RU"] > div::before {
        border-radius: 50%;
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%);
        content: '';
        flex: 0 0 14px;
        height: 14px;
        overflow: hidden;
        width: 14px;
    }

    button[aria-label$="English"]::before,
    li[id$="-opt-en-US"] > div::before {
        background:
            linear-gradient(#3c3b6e 0 0) left top / 48% 54% no-repeat,
            repeating-linear-gradient(
                to bottom,
                #b22234 0 7.7%,
                #fff 7.7% 15.4%
            );
    }

    button[aria-label$="Русский"]::before,
    li[id$="-opt-ru-RU"] > div::before {
        background: linear-gradient(
            to bottom,
            #fff 0 33.33%,
            #0039a6 33.33% 66.66%,
            #d52b1e 66.66%
        );
    }
</style>
